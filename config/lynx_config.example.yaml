# ============================================================
#  Lynx DATV Receiver — Example Configuration
# ============================================================
#  Copy this file to lynx_config.yaml and fill in your own
#  site details. Everything below is a placeholder — nothing
#  here is a real, working value.
#
#  Most settings (presets, streams, the default boot preset,
#  audio volume) can be left as-is and configured later
#  through the Web Control Portal instead — you generally only
#  need to edit the picotuner and site sections below by hand.
# ============================================================

audio:
  default_volume: 100

default_boot_preset: {}   # leave empty to resume the last state on boot instead

dial:
  menu_timeout_ms: 6000
  poll_interval_ms: 3000

diversity:
  combiner_out_port: 9943
  enabled: false
  hard_freeze_breaker_cooldown_secs: 300.0
  hard_freeze_breaker_enabled: true
  hard_freeze_breaker_min_retry_interval_secs: 5.0
  hard_freeze_breaker_required_clean_secs: 2.0
  hard_freeze_breaker_threshold: 5
  hard_freeze_breaker_window_secs: 300.0
  mer_switch_dwell_secs: 10.0
  mer_switch_margin_db: 1.0
  rcv1_plug: a
  rcv2_plug: b

notifications:
  companion:
    enabled: false
    gpio_enabled: false
    gpio_pin: 13
    gpio_polarity: high
    lock_settle_secs: 5.0
    lock_url: ''
    unlock_settle_secs: 5.0
    unlock_url: ''
  gpio_tx:
    enabled: false
    pin: 11
    polarity: high
    power_down_settle_secs: 900.0
    power_up_settle_secs: 5.0
    schedule_weekday_end: ''
    schedule_weekday_start: ''
    schedule_weekend_end: ''
    schedule_weekend_start: ''
  qrz:
    api_key: ''          # your QRZ XML API key, if using logbook notifications
    enabled: false
    settle_secs: 15.0
    suppress_mins: 60
    portable_locator: ''  # override for a contacted station's grid square,
                          # for when they're operating portable and haven't
                          # updated their QRZ profile - QRZ would otherwise
                          # calculate distance/bearing from their stale,
                          # registered locator. Set for the duration of a
                          # portable session, clear afterwards. Settable via
                          # the Web UI's QRZ config card - editing here is
                          # just the equivalent manual alternative.
                          # (Design note: deliberately just a plain string,
                          # so a future automated source - e.g. a GPS module,
                          # or a phone's GPS over Bluetooth, converted to a
                          # Maidenhead locator - could populate this same
                          # field without anything downstream needing to
                          # change. Not built; nothing reads GPS today.)
  slack:
    enabled: false
    message_template: '{site_callsign}''s 70cm input is active!

      Call sign: ''{rx_callsign}''

      MER: {mer}dB

      Watch the web stream at: rtmp://rtmp.batc.org.uk/live/{site_callsign_lower}'
    settle_secs: 15.0
    webhook_url: ''       # your Slack incoming webhook URL, if using Slack notifications

picotuner:
  cmd_port: 9921
  cmd_port_b: 9922
  default_plug: a
  host: 192.168.0.XXX     # <-- set this to your Picotuner's actual IP address
  status_port: 9997
  ts_port: 9941
  ts_port_b: 9942

presets:                    # Starting set for a fresh install - BATC's own network
                             # relays (reachable by anyone, not site-specific) plus
                             # generic 70cm/23cm starting frequencies at standard
                             # symbol rates. Add/remove any of these, or your own,
                             # from the Web Control Portal's Save buttons - this is
                             # just where they happen to live in the file.
  - type: stream
    name: GB3OO
    url: rtmp://rtmp.batc.org.uk/live/gb3oo
    note: BATC network relay
  - type: stream
    name: GB3HV
    url: rtmp://rtmp.batc.org.uk/live/gb3hv
    note: BATC network relay
  - type: stream
    name: GB3TV
    url: rtmp://rtmp.batc.org.uk/live/gb3tv
    note: BATC network relay
  - type: stream
    name: GB3SQ
    url: rtmp://rtmp.batc.org.uk/live/gb3sq
    note: BATC network relay
  - type: stream
    name: GB3GG
    url: rtmp://rtmp.batc.org.uk/live/gb3gg
    note: BATC network relay
  - type: stream
    name: GB3EN
    url: rtmp://rtmp.batc.org.uk/live/gb3en
    note: BATC network relay
  - type: stream
    name: GB3JV
    url: rtmp://rtmp.batc.org.uk/live/gb3jv
    note: BATC network relay
  - type: stream
    name: GB3JT
    url: rtmp://rtmp.batc.org.uk/live/gb3jt
    note: BATC network relay
  - type: stream
    name: BATC Oscar 100 net
    url: rtmp://rtmp.batc.org.uk/live/oscar100net
    note: BATC network relay
  - type: rf
    name: 437MHz 333k A
    freq: 437000
    sr: 333
    plug: a
    lnb_lo_khz: 0
    note: 70cm starting point
  - type: rf
    name: 437MHz 333k Diversity
    freq: 437000
    sr: 333
    plug: diversity
    lnb_lo_khz: 0
    note: 70cm starting point
  - type: rf
    name: 437MHz 1000k Diversity
    freq: 437000
    sr: 1000
    plug: diversity
    lnb_lo_khz: 0
    note: 70cm starting point
  - type: rf
    name: 1249MHz 333k A
    freq: 1249000
    sr: 333
    plug: a
    lnb_lo_khz: 0
    note: 23cm starting point
  - type: rf
    name: 1249MHz 1000k A
    freq: 1249000
    sr: 1000
    plug: a
    lnb_lo_khz: 0
    note: 23cm starting point

relay:
  enabled: false
  rtmp_url: ''

# Tri-watch: watches up to 3 sources simultaneously - any mix of RF
# receiver 1, RF receiver 2 (the Picotuner's two independent
# demodulator circuits - NOT the same thing as the "A"/"B" antenna-
# input plug selector, see rcv/fplug below), and one network stream
# input - so this receiver can cover multiple repeater inputs at once
# rather than needing separate hardware for each. Each source has its
# own enabled: true/false, so use any 2, or all 3, in whatever
# combination makes sense (e.g. two RF sources on the SAME frequency
# but different symbol rates - a tuner given one specific, known rate
# to lock onto, rather than scanning a range, does noticeably better
# on weak signals). Disabled by default.
#
# STAGE 1: every enabled source's active/locked status is genuinely
# tracked simultaneously (see /api/status' own "tri_watch" section),
# and the Picotuner stays tuned/monitored continuously rather than
# being retuned away whenever a stream plays. Confirmed directly
# against the real BATC RTMP server and real hardware, including the
# same-frequency/different-symbol-rate case (both receivers correctly,
# independently reporting lock at different rates on the same
# frequency).
#
# STAGE 2: when tri_watch is enabled, it REPLACES Lynx's normal
# resume-last-state behaviour entirely (even with only one source
# enabled) - every configured, enabled RF source is actively tuned at
# startup instead, so a dedicated repeater receiver always comes up on
# its correct, configured inputs regardless of what was happening
# before the last restart. Simple arbitration: whichever source goes
# active first holds the screen; if another source goes active while
# it's still playing, it does NOT preempt - instead, an on-screen
# notification pops up (see rf_notification_template below) saying
# something else wants attention, and takes over automatically once
# the currently-displayed source finishes. A 3-way split screen is a
# deliberately-deferred future idea, not built.
#
# Tested directly: the core arbitration decision logic (7 scenarios -
# handover, notification timing/expiry, no duplicate notifications,
# everything-inactive) as an isolated, standalone class before ever
# touching real hardware control, and the full startup-tuning path
# with mock UDP listeners standing in for the Picotuner's own command
# ports. NOT yet tested: the actual on-screen notification bubble
# (visual design work, not yet built into the OSD) or the arbitrator's
# live source-switching on real hardware end-to-end.
tri_watch:
  enabled: false
  # How long a source must stay CONTINUOUSLY active before tri_watch
  # shows a NOTIFICATION about it - deliberately does NOT delay the
  # actual display switch itself, which always reacts immediately to
  # the raw lock/active status. An earlier version applied this
  # uniformly to both, which caused a real, reported bug: stacked on
  # top of the separate, already-proven lock-stability debounce that
  # exists further upstream, a flickering raw signal (which the OSD's
  # own, already-smoothed lock indicator wouldn't show at all) could
  # prevent a picture from ever appearing at all, despite the OSD
  # showing a perfectly solid green light throughout. A source that
  # drops out and comes back starts this timer over from scratch for
  # notification purposes, rather than resuming where it left off.
  settling_seconds: 15
  # A SEPARATE, much SHORTER debounce (unlike settling_seconds above,
  # which only affects notifications) - requires this many seconds of
  # a SUSTAINED state change before the actual display switches at
  # all, in either direction (becoming active or becoming inactive).
  # Restores the same protection normal RF mode already gets from its
  # own lock-anti-bounce logic, which tri_watch's arbitrator otherwise
  # has none of at all. Confirmed live as genuinely necessary: without
  # it, brief flicker in the raw lock signal (invisible on the OSD,
  # which applies its own, separate smoothing before ever showing
  # green) could repeatedly tear the picture down and re-establish it,
  # sometimes never completing a full cycle at all - "solid lock, no
  # picture" despite genuinely nothing being wrong with the signal
  # itself.
  lock_confirm_seconds: 3
  # How long a "someone else wants in" notification stays on screen, in
  # seconds, before disappearing on its own.
  notification_duration_secs: 20
  # Template for the on-screen notification when a WAITING RF source
  # wants attention while something else is being displayed. Own,
  # separate system from the existing Slack notification's own
  # message_template (that one's built specifically around RF-lock
  # events with fields - MER, margin, modcod - a stream source has no
  # equivalent for; genuinely reusing the same template for both is a
  # Stage 4 item, not this one). Available placeholders:
  #   {callsign}            - whoever's actually, currently transmitting
  #                            on the waiting source (live, from the
  #                            Picotuner's own decode)
  #   {configured_callsign} - this input's own identity (the "callsign"
  #                            field set per-source below, e.g. the
  #                            repeater's own callsign)
  #   {frequency}            - the waiting source's configured frequency
  rf_notification_template: '{callsign} is waiting to access {configured_callsign} on {frequency}'
  sources:
    - type: rf
      enabled: false
      rcv: 1                   # <-- 1 or 2 - which actual receiver circuit, NOT the antenna
                                #     input (fplug below) - outside diversity mode, both
                                #     "plug A" and "plug B" run through the SAME rcv=1
                                #     circuit, so this is the field that actually matters
                                #     for telling two RF sources apart
      fplug: a                 # <-- a or b - which physical antenna input this receiver
                                #     circuit reads from (independent of rcv - real wiring
                                #     varies by site)
      freq: 437000              # <-- kHz
      sr: 333                   # <-- kS/s
      lnb_lo_khz: 0
      label: ''                  # <-- optional, shown in the Web UI - defaults to something sensible if left blank
      callsign: ''                # <-- optional - this input's own callsign (e.g. the
                                   #     repeater's), used as {configured_callsign} in the
                                   #     notification template above. Falls back to label,
                                   #     then a generic "this input", if left blank
    - type: rf
      enabled: false
      rcv: 2
      fplug: b
      freq: 437000
      sr: 1000
      lnb_lo_khz: 0
      label: ''
      callsign: ''
    - type: stream
      enabled: false
      domain: ''       # <-- e.g. rtmp.batc.org.uk
      app: ''          # <-- e.g. live
      streamname: ''   # <-- e.g. gb3jtinput
      port: 1935
      label: ''
      waiting_message: ''   # <-- plain text shown when this source is waiting - no
                             #     placeholders (unlike the RF template above), since
                             #     there's no live "who's transmitting" data available
                             #     for a stream the way there is for RF. Falls back to
                             #     "<label> wants attention" if left blank

ryde:
  enabled: false
  host: 192.168.XXX.XXX   # <-- your Ryde host's IP, if using Ryde
  port: 8765

# IMPORTANT, AT A REPEATER SITE
# The end-of-contact card appears AFTER the station has stopped
# transmitting - by default 15s later, staying up for 30s, so the last
# of it is on screen 45s after unlock. Anything that reacts to the
# unlock transition can cut away before viewers ever see it:
#
#   * a repeater controller's hang/tail timer dropping the transmitter
#   * a video switcher or Bitfocus Companion action changing source on
#     the unlock webhook
#   * any external "no signal, switch to test card" logic
#
# Give those a hold-off of at least delay_secs + duration_secs (32s
# with the defaults below), or shorten the card to fit the hang time
# you already have. Lynx's own gpio_tx keying needs no change - its
# power_down_settle_secs is far longer than this window.
# ---------------------------------------------------------------------
#  Auto-Squeak - audio path measurement from a Lindos test sequence
# ---------------------------------------------------------------------
# Listens for a Lindos sequence on the received audio and puts a
# measurement card on screen after each pass: level against alignment,
# channel balance, frequency response, noise, separation and THD.
#
# On by default. It is idle until a sequence actually arrives, and it
# reads the same audio monitor the PPM meter already uses, so the cost
# of leaving it on is negligible.
#
# Unlike Pathfinder, the card is drawn OVER live video. That is
# deliberate: the results are wanted during the transmission, in the
# gap between passes, so an adjustment can be made and the next pass
# seen. It also takes priority over a Pathfinder card where both fall
# due at once.
squeak:
  enabled: true
  # Which monitor to listen on. Leave BLANK and it follows whatever
  # output mpv is actually playing to - the same rule the PPM meter
  # uses, and for the same reason: watching the system default instead
  # means that selecting a different output leaves the measurement
  # reading silence, which looks like a broken detector rather than a
  # misdirected one. Only set a name here to override that.
  source: ''
  # How long a card stays up. Worth setting close to the gap between
  # passes in your test file, so the previous result is still visible
  # while an adjustment is being made rather than clearing too early.
  hold_secs: 45
  label: 'off-air'

pathfinder:
  enabled: true
  delay_secs: 2           # quiet gap after a station stops, before the card appears
                          # (2s tested on air - long enough to read as a pause,
                          #  short enough that nobody has drifted away yet)
  duration_secs: 30       # how long the card stays on screen
  min_span_km: 15         # closest zoom, so a local contact still shows context
  max_span_km: 1000       # widest zoom - beyond this the frame stops growing
  max_distance_km: 1200   # further than this, the locator is assumed stale
  qo100_test: false       # DEVELOPMENT/DEMO ONLY - forces every card to draw the
                          # QO-100 globe view regardless of the real frequency.
                          # A contact via QO-100 is normally detected on its own,
                          # by adding the LNB LO back to the frequency the
                          # Picotuner reports and testing the resulting downlink
                          # against the satellite-only part of 3cm - so this
                          # switch is never needed in normal operation. It exists
                          # so the globe can be developed and demonstrated at a
                          # site with no 3cm satellite installation, and is
                          # deliberately not on the Config page: it makes every
                          # card wrong, and is only ever wanted by someone
                          # editing this file by hand. Leave false.
                          # rather than the contact genuinely extraordinary,
                          # and no card is drawn. Matches the extent of the
                          # map data shipped in geo/.

site:
  callsign: XXXXX          # <-- your callsign
  location: ''             # <-- your site location, e.g. "Anytown, Anyshire"
  locator: ''               # <-- your Maidenhead locator
  name: My Lynx Receiver

display:
  ppm_style: full_fat   # "skeleton" (needles/graduations only) or
                          # "full_fat" (adds the round meter housing) -
                          # also settable from the Web UI's Config page,
                          # applies live within a few seconds either way

streams: []

web:
  host: 0.0.0.0
  port: 8080
  secret_key: ''
